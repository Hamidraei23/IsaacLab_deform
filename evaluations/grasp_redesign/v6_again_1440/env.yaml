sim:
  device: cuda:0
  dt: 0.008333333333333333
  gravity: !!python/tuple
  - 0.0
  - 0.0
  - -9.81
  physics_prim_path: /physicsScene
  physics_material:
    func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
    static_friction: 0.5
    dynamic_friction: 0.5
    restitution: 0.0
    density: null
    _usd_applied_schema: null
    _usd_field_exceptions: {}
    _usd_namespace: physics
  use_fabric: true
  render_interval: 4
  enable_scene_query_support: false
  use_newton_actuators: false
  physics:
    class_type: isaaclab_contrib.coupling.coupler:NewtonCouplerManager
    num_substeps: 2
    collision_decimation: 0
    debug_mode: false
    use_cuda_graph: true
    deterministic_mode: not_guaranteed
    solver_cfg:
      class_type: isaaclab_contrib.coupling.coupler:NewtonCouplerManager
      solver_type: None
      model_cfg:
        soft_contact_ke: 8000.0
        soft_contact_kd: 0.01
        soft_contact_mu: 10.0
      entries:
      - name: rigid
        solver_cfg:
          class_type: isaaclab_newton.physics.mjwarp_manager:NewtonMJWarpManager
          solver_type: mujoco_warp
          njmax: 300
          nconmax: null
          iterations: 100
          ls_iterations: 20
          solver: newton
          integrator: implicitfast
          use_mujoco_cpu: false
          disable_contacts: false
          disable_sensors: false
          default_actuator_gear: null
          actuator_gears: null
          update_data_interval: 1
          save_to_mjcf: null
          impratio: 1.0
          cone: elliptic
          ccd_iterations: 35
          ls_parallel: false
          use_mujoco_contacts: true
          tolerance: 1.0e-06
        bodies:
        - /World/envs/env_.*/Robot
        - /World/envs/env_.*/MannequinArm
        - /World/envs/env_.*/Slot(Neg|Pos)Y
        particles: []
        all_particles: false
        include_child_joints: true
        include_body_shapes: true
        include_static_shapes: false
        shape_label_patterns: []
        substeps: 1
        in_place: false
      - name: soft
        solver_cfg:
          class_type: isaaclab_contrib.deformable.vbd_manager:NewtonVBDManager
          solver_type: None
          model_cfg: null
          iterations: 10
          integrate_with_external_rigid_solver: false
          particle_enable_self_contact: false
          particle_self_contact_radius: 0.005
          particle_self_contact_margin: 0.005
          particle_collision_detection_interval: -1
          particle_vertex_contact_buffer_size: 32
          particle_edge_contact_buffer_size: 64
          particle_topological_contact_filter_threshold: 2
          particle_rest_shape_contact_exclusion_radius: 0.0
          rigid_contact_k_start: 100.0
          rigid_body_particle_contact_buffer_size: 1024
        bodies: []
        particles: []
        all_particles: true
        include_child_joints: true
        include_body_shapes: true
        include_static_shapes: true
        shape_label_patterns: []
        substeps: 1
        in_place: false
      proxies:
      - source: rigid
        destination: soft
        bodies:
        - /World/envs/env_.*/Robot/Geometry/.*panda_hand
        - /World/envs/env_.*/Robot/Geometry/.*panda_(left|right)finger
        - /World/envs/env_.*/MannequinArm
        - /World/envs/env_.*/Slot(Neg|Pos)Y
        particles: []
        mode: lagged
        mass_scale: 1.0
        collide_interval: 1
        collision_pipeline:
          broad_phase: explicit
          reduce_contacts: true
          rigid_contact_max: null
          max_triangle_pairs: 1000000
          soft_contact_max: null
          soft_contact_margin: 0.01
          enable_rigid_soft_full_surface_contact: true
          requires_grad: null
          sdf_hydroelastic_config: null
      iterations: 1
    collision_cfg: null
    default_shape_cfg:
      margin: 0.0
      gap: 0.01
      ke: 2500.0
      kd: 100.0
      mu: 1.0
    simplify_meshes: true
    load_visual_shapes: null
    bvh_constructor_geometry: cubql
    bvh_constructor_scene: sah
    bvh_constructor_gaussian: cubql
  create_stage_in_memory: false
  logging_level: WARNING
  save_logs_to_file: true
  log_dir: null
  visualizer_cfgs: []
  default_visualizer_cfg:
    eye: !!python/tuple
    - 0.75
    - 0.25
    - 0.65
    lookat: !!python/tuple
    - 0.0
    - 0.75
    - 0.4
    focal_length: 12.0
    streaming_view: false
    streaming_sensor_prim_path: null
    streaming_cam_target_prim_path: null
    streaming_cam_eye: !!python/tuple
    - 4.0
    - -4.0
    - 3.0
    streaming_cam_renderer: null
    streaming_envs: 32
    streaming_gt_types: !!python/tuple
    - rgb
    streaming_depth_min: 0.1
    streaming_depth_max: 10.0
    max_visible_envs: null
    visible_env_indices: null
    randomly_sample_visible_envs: true
    enable_markers: true
    enable_live_plots: true
    live_plots_update_interval: 5
    visualizer_type: null
    tiled_cam_view: null
    tiled_cam_num: null
    tiled_cam_env_indices: null
    tiled_cam_prim_path: null
    tiled_cam_eye: null
    tiled_cam_target_prim_path: null
    tiled_cam_renderer: null
